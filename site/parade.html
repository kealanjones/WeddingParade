<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sop and Bop's Wedding Balloon Parade</title>
  <meta name="description" content="Sophie and Ben's wedding balloon parade.">
  <meta name="theme-color" content="#7cc4ee">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/parade.css">
</head>
<body class="parade">
  <canvas id="sky" aria-label="Balloons drifting across the sky. Tap one to read its note."></canvas>

  <div class="parade-title" id="parade-title">
    <h1><span class="h1-top">Sop and Bop's</span> Wedding Balloon Parade</h1>
    <p class="parade-sub">Just married! Sophie &amp; Ben, 16 October 2026</p>
    <p class="parade-count" id="parade-count"></p>
  </div>
  <div class="corner-btns">
    <button class="corner-btn" id="replay" type="button" hidden>Replay lift-off</button>
    <button class="corner-btn" id="fullscreen" type="button" hidden>Full screen</button>
  </div>
  <p class="parade-hint" id="parade-hint" hidden>Tap a balloon to see who made it</p>

  <div class="waiting" id="waiting" hidden>
    <div class="waiting-card">
      <h1><span class="h1-top">Sop and Bop's</span> Wedding Balloon Parade</h1>
      <p class="big">The parade takes off on <strong id="launch-date">Friday 16 October</strong></p>
      <p class="waiting-count" id="waiting-count" aria-live="polite"></p>
      <p><a href="index.html" class="btn btn-primary">Make a balloon</a></p>
    </div>
  </div>

  <div class="note-card" id="note-card" role="dialog" aria-modal="false" aria-labelledby="note-name" hidden>
    <button class="note-close" id="note-close" type="button" aria-label="Close">×</button>
    <img id="note-img" alt="">
    <div>
      <p class="note-from">A balloon from</p>
      <h2 id="note-name"></h2>
      <p id="note-text"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/parade.js"></script>
</body>
</html>
